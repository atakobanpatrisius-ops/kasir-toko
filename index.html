const FTL = [["jakarta", "Jakarta", "Bawaan aplikasi"], ["inter", "Inter", "Rapi dan modern"], ["carlito", "Carlito", "Mirip Calibri, ramping"], ["heros", "Heros Condensed", "Gaya Helvetica sempit, hemat tempat"], ["poppins", "Poppins", "Bulat dan ramah"], ["liberation", "Liberation Sans", "Mirip Arial, netral"], ["klasik", "Klasik", "Huruf berkaki (serif)"], ["modern", "Modern", "Huruf bawaan sistem"]];
const FTF = { klasik: "Georgia,'Times New Roman',serif", modern: "'Trebuchet MS','Segoe UI',Verdana,sans-serif" };
function ftCss(id, fam) {
  const f = FD[id];
  if (!f) return "";
  return f.f.map(([w, d, t]) => `@font-face{font-family:'${fam}';font-style:normal;font-weight:${w};font-display:swap;${f.sa ? "size-adjust:" + f.sa + "%;" : ""}src:url(data:font/${t};base64,${d}) format('${t}')}`).join("");
}
function ftApply(id) {
  if (!FD[id]) id = "jakarta";
  document.documentElement.setAttribute("data-ft", id);
  let st = document.getElementById("ftx");
  if (!st) {
    st = document.createElement("style");
    st.id = "ftx";
    document.head.appendChild(st);
  }
  st.textContent = ftCss(id, "KalJakarta");
}
function ftPrev() {
  if (document.getElementById("ftp")) return;
  const st = document.createElement("style");
  st.id = "ftp";
  st.textContent = FTL.map((x) => ftCss(x[0], "KF_" + x[0])).join("");
  document.head.appendChild(st);
}
function ftSet(id) {
  if (id === "klasik" || id === "modern") {
    D.set.fn = id;
    save();
    applyTh();
    render();
    toast("Huruf: " + FTL.find((x) => x[0] === id)[1]);
    return;
  }
  if (!FD[id]) return;
  D.set.fn = "";
  D.set.ft = id;
  save();
  applyTh();
  ftApply(id);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitCols());
  toast("Huruf: " + FTL.find((x) => x[0] === id)[1]);
}
function ftUI() {
  ftPrev();
  const cur = D.set.fn || D.set.ft || "jakarta";
  const fam = (id) => FTF[id] || "'KF_" + id + "',sans-serif";
  return (
    '<div class="sm" style="margin:2px 2px 10px">Pilih jenis huruf. Berlaku untuk seluruh aplikasi dan gambar nota.</div><div class="ftg">' +
    FTL.map((x) => `<div class="ftk${cur === x[0] ? " on" : ""}" onclick="ftSet('${x[0]}')" style="font-family:${fam(x[0])}"><b>${x[1]}</b><span>${x[2]}</span></div>`).join("") +
    '</div><div class="ftv" style="font-family:' + fam(cur) + '"><b>ANCHOR MASKING 24 X 40 Y</b><small>Stok 4 DOS + 6 ROL = 150 ROL \u2022 Rp14.200</small></div>'
  );
}
ftApply((D.set && D.set.ft) || "jakarta");


/* ===== SELISIH STOK: barang Plus/Minus dari Cek Stok yang sudah Selesai, menunggu konfirmasi =====
 Data tidak disalin: memakai snapshot Cek Stok (c.snap). Status per barang di c.adj[pid]:
 {st:'ok'|'skip', tgl, n}. Stok sistem baru berubah setelah konfirmasi, dan tercatat di Riwayat Stok. */
let SLF = "wait";
function selItems() {
  const out = [];
  D.chk.forEach((c) => {
    if (c.st !== "selesai" || !c.sel || !c.snap) return;
    c.snap.forEach((r) => {
      if (r.fis == null) return;
      const d = r.fis - r.sis;
      if (!d) return;
      out.push({ c, r, d, a: c.adj && c.adj[r.pid] });
    });
  });
  return out.reverse();
}
const selN = () => {
  try {
    return selItems().filter((x) => !x.a).length;
  } catch (e) {
    return 0;
  }

  $("warn").classList.add("on");
}
function bkRemind() {

    const t = today();
    if (D.set.bkAsk === t) return;

    $("warn").classList.add("on");
  } catch (e) {
  }
}
applyZoom();
lockShow();
$("welT").textContent = D.toko;

if (D.set.welcome === false) {
  const w = document.getElementById("wel");
  if (w) {
    w.remove();
    swG("g1");

}
function puHome() {
  const h = document.documentElement;
  if (h.getAttribute("data-th") !== "putih" || view !== "home") return;
  const g = document.querySelector(".cs-grid");
  if (!g || g.dataset.pu) return;
  g.dataset.pu = "1";
  const by = {};
  g.querySelectorAll(":scope>.cs-tile").forEach((b) => {
    const m = /go\('(\w+)'\)/.exec(b.getAttribute("onclick") || "");
    if (m) by[m[1]] = b;
  });
  const G = [["Transaksi", ["jual", "trx", "cus", "kel"]], ["Barang", ["prod", "stok", "cek", "sel", "trf"]], ["Laporan dan pengaturan", ["lap", "laba", "set"]]];
  let last = null;
  G.forEach(([t, ks]) => {
    const els = ks.map((k) => by[k]).filter(Boolean);
    if (!els.length) return;
    const l = document.createElement("div");
    l.className = "pu-t";
    l.textContent = t;
    const c = document.createElement("div");
    c.className = "pu-c";
    els.forEach((e) => c.appendChild(e));
    g.appendChild(l);
    g.appendChild(c);
    last = c;
  });
  g.querySelectorAll(":scope>.cs-tile").forEach((b) => {
    if (last) last.appendChild(b);
  });
}
(() => {
  const r = render;
  render = function() {
    const x = r.apply(this, arguments);
    try {
      puHome();
    } catch (e) {
    }
    return x;
  };
})();
</script>
<script>
/* ===== PENYIMPANAN: IndexedDB sebagai utama (tanpa batas 5 MB), localStorage sebagai cadangan cepat ===== */
(function () {
  var DBN = 'kasir-db', ST = 'kv', LS = window.localStorage, P = Storage.prototype;
  var gI = P.getItem, sI = P.setItem, rI = P.removeItem;
  var db = null, mem = null, pend = null, busy = false, bad = false, started = false, dirty = false, snapAt = Date.now(), waiters = [];

  function openDB(cb) {
    try {
      var q = indexedDB.open(DBN, 1);
      q.onupgradeneeded = function () { q.result.createObjectStore(ST); };
      q.onsuccess = function () { cb(q.result); };
      q.onerror = q.onblocked = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function rd(k) {
    return new Promise(function (res) {
      try { var t = db.transaction(ST).objectStore(ST).get(k); t.onsuccess = function () { res(t.result); }; t.onerror = function () { res(null); }; }
      catch (e) { res(null); }
    });
  }
  function wr(k, v) {
    return new Promise(function (res) {
      try { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).put(v, k); t.oncomplete = function () { res(true); }; t.onerror = t.onabort = function () { res(false); }; }
      catch (e) { res(false); }
    });
  }
  function del(k) {
    return new Promise(function (res) {
      try { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).delete(k); t.oncomplete = function () { res(); }; t.onerror = t.onabort = function () { res(); }; }
      catch (e) { res(); }
    });
  }
  function keys() {
    return new Promise(function (res) {
      try { var t = db.transaction(ST).objectStore(ST).getAllKeys(); t.onsuccess = function () { res(t.result || []); }; t.onerror = function () { res([]); }; }
      catch (e) { res([]); }
    });
  }
  function dayKey(ts) {
    var d = new Date(ts);
    return 'snap-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function flush() {
    if (busy || !pend || !db) return;
    busy = true;
    var p = pend; pend = null;
    wr('kasir', p).then(function (ok) {
      bad = !ok;
      var snap = Promise.resolve();
      if (ok && Date.now() - snapAt > 30 * 60 * 1000) {
        snapAt = Date.now();
        snap = wr(dayKey(p.ts), p).then(function () { return wr('snapmeta', { ts: snapAt }); }).then(function () { return keys(); }).then(function (ks) {
          var old = ks.filter(function (k) { return /^snap-/.test(k); }).sort().reverse().slice(7);
          return Promise.all(old.map(del));
        });
      }
      return snap;
    }).then(function () {
      busy = false;
      if (pend) flush();
      else waiters.splice(0).forEach(function (f) { f(); });
    });
  }

  window.KS_flush = function () {
    return new Promise(function (res) { if (!pend && !busy) res(); else { waiters.push(res); flush(); } });
  };
  window.KS_snaps = function () {
    if (!db) return Promise.resolve([]);
    return keys().then(function (ks) {
      var L = ks.filter(function (k) { return /^snap-\d/.test(k); }).sort().reverse();
      return Promise.all(L.map(function (k) { return rd(k).then(function (r) { return { k: k, ts: r ? r.ts : 0, kb: r ? Math.round(r.v.length / 512) : 0 }; }); }));
    });
  };
  window.KS_snapGet = function (k) { return rd(k).then(function (r) { return r ? r.v : null; }); };
  window.KS_ready = function () { return !!db && started; };

  function patch() {
    P.getItem = function (k) { return (this === LS && k === 'kasir') ? mem : gI.apply(this, arguments); };
    P.setItem = function (k, v) {
      if (this === LS && k === 'kasir') {
        var str = String(v), ts = Date.now(), err = null;
        mem = str; dirty = true;
        try { sI.call(LS, 'kasir', str); sI.call(LS, 'kasir_ts', String(ts)); }
        catch (e) {
          err = e;
          try { rI.call(LS, 'kasir'); } catch (_) {}
          try { sI.call(LS, 'kasir_ts', String(ts)); } catch (_) {}
        }
        pend = { v: str, ts: ts };
        flush();
        if (err && bad) throw err;
        return;
      }
      return sI.apply(this, arguments);
    };
  }

  function boot() {
    if (started) return;
    started = true;
    var src = document.getElementById('app-src');
    var el = document.createElement('script');
    el.text = src.textContent;
    document.body.appendChild(el);
    document.documentElement.classList.add('rdy');
  }

  /* Jalur cepat: kalau data sudah ada di localStorage, aplikasi langsung dibuka.
     IndexedDB disambungkan di belakang layar setelah aplikasi tampil. */
  var lv0 = gI.call(LS, 'kasir'), lt0 = +gI.call(LS, 'kasir_ts') || 0;

  function reconcile(d) {
    db = d;
    rd('kasir').then(function (rec) {
      if (rec && rec.v && rec.ts > lt0 && rec.v !== mem && !dirty && !sessionStorage.getItem('ks_rl')) {
        try { sessionStorage.setItem('ks_rl', '1'); } catch (_) {}
        location.reload();
        return;
      }
      return rd('snapmeta').then(function (meta) {
        if (!meta || Date.now() - meta.ts > 30 * 60 * 1000) snapAt = 0;
        var legacy = gI.call(LS, 'kasir_cadangan_sebelum_3satuan'), step = Promise.resolve();
        if (legacy) {
          step = wr('legacy-sebelum-3satuan', { v: legacy, ts: Date.now() }).then(function (ok) {
            if (ok) { try { rI.call(LS, 'kasir_cadangan_sebelum_3satuan'); } catch (_) {} }
          });
        }
        return step;
      }).then(function () {
        if (mem && !dirty && (!rec || rec.v !== mem)) pend = { v: mem, ts: lt0 || Date.now() };
        flush();
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
      });
    });
  }

  if (lv0) {
    mem = lv0;
    patch();
    boot();
    setTimeout(function () { openDB(function (d) { if (d) reconcile(d); }); }, 800);
    return;
  }

  /* Jalur lambat (pemasangan baru / data besar yang hanya ada di IndexedDB) */
  var timer = setTimeout(function () { if (!db) boot(); }, 2500);
  openDB(function (d) {
    if (!d) { clearTimeout(timer); boot(); return; }
    if (started) return;
    db = d;
    rd('kasir').then(function (rec) {
      if (started) return;
      mem = rec && rec.v ? rec.v : null;
      var legacy = gI.call(LS, 'kasir_cadangan_sebelum_3satuan');
      var step = Promise.resolve();
      if (legacy) {
        step = wr('legacy-sebelum-3satuan', { v: legacy, ts: Date.now() }).then(function (ok) {
          if (ok) { try { rI.call(LS, 'kasir_cadangan_sebelum_3satuan'); } catch (_) {} }
        });
      }
      step.then(function () {
        if (started) return;
        patch();
        clearTimeout(timer);
        boot();
        flush();
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
      });
    });
  });
})();
